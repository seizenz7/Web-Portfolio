server {
    # Port yang digunakan oleh Nginx untuk mendengarkan request masuk
    listen       8010;
    listen  [::]:8010;
    server_name  _;

    # Direktori root tempat file statis (hasil build React/Vite/Esbuild) disimpan
    root   /usr/share/nginx/html;
    # File default yang akan dilayani saat mengakses root URL (/)
    index  index.html;

    # ── Security Headers ───────────────────────────────────────────────────────
    # Mencegah website di-embed dalam iframe pada domain lain (mencegah Clickjacking)
    add_header X-Frame-Options           "SAMEORIGIN"                     always;
    # Mencegah browser menebak tipe konten, memaksa mematuhi Content-Type header
    add_header X-Content-Type-Options    "nosniff"                        always;
    # Mengaktifkan perlindungan XSS bawaan browser (memblokir rendering jika terdeteksi XSS)
    add_header X-XSS-Protection         "1; mode=block"                  always;
    # Mengontrol informasi referer yang dikirim bersama request ke luar origin
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # Membatasi akses ke fitur browser seperti kamera, mikrofon, dan geolokasi
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    # Kebijakan konten yang ketat: 
    # Hanya izinkan load resource dari domain sendiri (self), 
    # Izinkan inline script/style, load font dari Google, dan akses data URI untuk gambar
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self';" always;

    # ── Gzip Compression ───────────────────────────────────────────────────────
    # Mengaktifkan kompresi Gzip untuk memperkecil ukuran file saat ditransfer
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;          # Tingkat kompresi (1-9), level 6 adalah keseimbangan terbaik (cpu vs size)
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_min_length   256;        # Hanya kompres file yang ukurannya lebih dari 256 bytes
    # Tipe file yang akan dikompres:
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml
        font/ttf
        font/opentype
        application/font-woff
        application/font-woff2;

    # ── Static Asset Caching ───────────────────────────────────────────────────
    # Konfigurasi caching untuk file statis (gambar, font, css, js hasil build)
    # File-file ini biasanya sudah memiliki hash di namanya, jadi aman di-cache jangka panjang (1 tahun)
    location ~* \.(js|css|woff2?|ttf|eot|otf|ico|svg|png|jpg|jpeg|gif|webp|avif)$ {
        expires     1y;
        # "public" berarti bisa di-cache oleh browser dan CDN
        # "immutable" memberi tahu browser bahwa file ini tidak akan pernah berubah (karena ada hash)
        add_header  Cache-Control "public, immutable";
        access_log  off; # Matikan log untuk file aset agar log tidak cepat penuh
    }

    # ── Server-Sent Events (SSE) / Live Reload ─────────────────────────────────
    # Mematikan buffering untuk route EventSource (MIME type: text/event-stream)
    # agar aliran data (seperti live-reload /esbuild atau /api/stream) bisa 
    # langsung terkirim ke klien tanpa ditahan/di-buffer oleh Nginx.
    location ~ ^/(esbuild|events|api/stream) {
        proxy_buffering off;
        chunked_transfer_encoding on;
        proxy_cache off;
        
        # Header penting untuk menjaga koneksi tetap terbuka (keep-alive)
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        
        # (Opsional) Jika Anda menggunakan Nginx sebagai reverse proxy ke backend:
        # proxy_pass http://backend_server; 
    }

    # ── SPA Fallback (React Router) ────────────────────────────────────────────
    # Aturan routing utama untuk Single Page Application (SPA) seperti React/Vue
    location / {
        # 1. Coba cari file yang sesuai URI persis
        # 2. Coba cari direktori yang sesuai URI
        # 3. Jika tidak ketemu semua, arahkan ke index.html (biarkan React Router yang menangani)
        try_files $uri $uri/ /index.html;

        # index.html TIDAK BOLEH di-cache sama sekali
        # Ini memastikan bahwa setiap kali pengguna membuka aplikasi, mereka mendapat versi terbaru
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma        "no-cache";
        expires    0;
    }

    # ── Health Check Endpoint (Untuk K8s Probes) ───────────────────────────────
    # Endpoint ringan khusus untuk memantau status aplikasi (Liveness/Readiness probes)
    location /healthz {
        access_log  off;          # Matikan log agar request health check tidak membanjiri log
        return      200 "OK\n";   # Langsung membalas dengan status 200 OK
        add_header  Content-Type text/plain;
    }

    # ── Block Hidden Files ─────────────────────────────────────────────────────
    # Memblokir akses ke file atau direktori tersembunyi (dimulai dengan titik, contoh: .git, .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Error Pages ────────────────────────────────────────────────────────────
    # Jika terjadi error tidak terduga atau 404 pada file statis yang benar-benar tidak ada,
    # tetap arahkan kembali ke index.html sebagai fallback
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
